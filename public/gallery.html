<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Galerie</title>
  <link rel="stylesheet" href="/css/style.css">

  <style>
    body {
      margin: 0;
    }

    /* NAVBAR */
    nav {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(255,240,246,0.95);
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 15px 0;
      z-index: 9999;
      backdrop-filter: blur(6px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .pink-btn {
      background: linear-gradient(90deg,#ffb6d5 0%,#ff69b4 100%);
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 10px 28px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 18px #ff69b455;
    }

    .pink-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 6px 24px #ff69b488;
    }

    /* Poème arrière-plan */
    #poem-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Brush Script MT', cursive;
      font-size: 2em;
      text-align: center;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <button id="poemNavBtn" class="pink-btn">Poème</button>
    <button id="surpriseNavBtn" class="pink-btn">Surprise</button>
    <button onclick="window.history.back()" class="pink-btn">Retour</button>
  </nav>

  <!-- Poème en arrière-plan -->
  <div id="poem-bg">
    Winnie, ma princesse au rire étincelant,
    Toujours joueuse, légère comme le vent...
  </div>

  <!-- Galerie -->
  <div id="mainGallery">
    <div class="gallery-container">
      <section class="photo-section">
        <div class="photo-frame">
          <img id="carousel" src="/images/1.jpeg" alt="photo">
        </div>
      </section>
    </div>
  </div>

  <!-- Modal Poème -->
  <div id="poemModal" style="display:none;position:fixed;inset:0;background:rgba(255,240,246,0.98);z-index:10000;">
    <div style="max-width:600px;margin:80px auto;background:#fff;padding:30px;border-radius:16px;">
      <h2>Poème</h2>
      <p>Winnie, ma princesse au rire étincelant...</p>
      <button onclick="document.getElementById('poemModal').style.display='none'" class="pink-btn">
        Fermer
      </button>
    </div>
  </div>

  <script type="module">
    document.getElementById('poemNavBtn').onclick = function(){
      document.getElementById('poemModal').style.display = 'block';
    };

    document.getElementById('surpriseNavBtn').onclick = function(){
      window.location.href = '/Flower-animation-main/FLORES.html';
    };
  </script>

</body>
</html>
